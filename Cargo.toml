[package]
name = "ferox"
version = "0.1.0"
edition = "2024"
description = "Provider agnostic Large Language Model gateway"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
serde_json = "1.0.149"
reqwest = { version = "0.13.3", features = ["stream"] }
async-stream = "0.3.6"
futures-core = "0.3.32"
futures-util = "0.3.32"
http = "1.4.1"

[dev-dependencies]
wiremock = "0.6.5"

[features]
e2e-tests = []

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["e2e-tests"]
