[package]
name = "ferox"
version = "0.1.0"
edition = "2024"

[dependencies]
async-openai = {version = "0.36.0", features = ["responses","chat-completion"]}
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros"] }
toml = "1.1.2"
futures = "0.3"
serde_json = "1.0.149"
reqwest = "0.13.3"
error = "0.1.9"
